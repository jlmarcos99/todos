name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Pack the CLI
        run: npm pack --json > pack.json

      - name: Install and run the packed CLI
        run: |
          tarball="$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('pack.json', 'utf8'))[0].filename)")"
          install_dir="$(mktemp -d)"
          npm install --prefix "$install_dir" --no-audit --no-fund "./$tarball"
          "$install_dir/node_modules/.bin/todos" --help
